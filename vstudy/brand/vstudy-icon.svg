<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
	<!--
		VStudy app icon — bold geometric "V" whose counter holds an open book:
		the two heavy strokes are the covers, the lighter chevrons the fanned pages,
		and the deep-slate negative space between them the gutter of the open book.
		Two-tone indigo (#4F46E5 / #818CF8) on deep slate (#1E1B2E).
		Full-bleed master (Apple icon grid: rounded square, r = 232 at 1024).
	-->
	<rect width="1024" height="1024" rx="232" fill="#1E1B2E"/>
	<!-- V / book covers -->
	<path d="M258 240H390L512 564L634 240H766L562 782H462Z" fill="#4F46E5"/>
	<!-- fanned pages -->
	<path d="M437 276L512 476L587 276H566L512 420L458 276Z" fill="#818CF8"/>
	<path d="M476 276L512 372L548 276H527L512 316L497 276Z" fill="#818CF8"/>
</svg>
